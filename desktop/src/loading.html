<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>AgentCenter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #e8eefc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: radial-gradient(circle at 30% 20%, #67e8f9, #7c3aed 70%);
        box-shadow: 0 0 40px rgba(103, 232, 249, 0.25);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      #status {
        color: #93a4c7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark"></div>
      <h1>AgentCenter</h1>
      <div id="status">正在启动本地服务…</div>
    </div>
  </body>
</html>
