[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcenter-fleet"
version = "0.1.0"
description = "AgentCenter 设备侧连接器：扫描本机智能体，并与云端协调器通讯"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
fleet-edge = "agentcenter_fleet.edge:main"

[tool.setuptools.packages.find]
where = ["src"]
